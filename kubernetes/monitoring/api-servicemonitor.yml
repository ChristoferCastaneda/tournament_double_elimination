apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tournaments-api
  namespace: tournaments
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames: [tournaments]
  selector:
    matchLabels:
      app: tournaments-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
